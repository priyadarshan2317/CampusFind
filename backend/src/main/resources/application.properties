spring.application.name=campusfind
spring.config.import=optional:classpath:local.properties

# Database
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/campusfind_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}

# Server
server.port=${PORT:8081}

# JWT (no default on purpose: the app refuses to start without a secret)
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# File upload
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.upload-dir=${UPLOAD_DIR:uploads}